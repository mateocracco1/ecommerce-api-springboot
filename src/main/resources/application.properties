spring.application.name=springboot.tienda


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/miproyecto_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


product.low-stock-threshold=5

jwt.secret=${JWT_SECRET:EstaEsUnaClaveSuperSecretaYMuyLargaParaQueSpringSecurityNoSeQueje12345}
jwt.expiration=3600000

#Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
